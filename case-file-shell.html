<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Case File</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: case-file workspace — sticky tab rail, summary first, every finding tagged by evidence class and linked to its source */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --ink:#1b2230; --muted:#5b6475; --line:#d9dde4; --soft:#e9ecf1;
  --accent:#2f4a7a; --accent-soft:#e3e9f4;
  --rec:#0f6e66; --rec-bg:#dcefed;
  --rep:#2c5aa0; --rep-bg:#dfe8f6;
  --self:#6b3fa0; --self-bg:#ece3f6;
  --all:#a35c00; --all-bg:#f8ead6;
  --unv:#8a4a5a; --unv-bg:#f3e1e5;
  --ok:#2e7d4a; --warn:#a35c00; --bad:#a3322c; --none:#6a7383;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --display:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --panel:#1a2029; --ink:#e4e8ee; --muted:#9aa4b4; --line:#2c3440; --soft:#222a35;
  --accent:#8fb0e8; --accent-soft:#233149;
  --rec:#5fc4b9; --rec-bg:#16312f; --rep:#86aee9; --rep-bg:#1b2a42; --self:#bf9be8; --self-bg:#2b2140;
  --all:#e5a957; --all-bg:#382a16; --unv:#d993a5; --unv-bg:#3a2229;
  --ok:#6cc28a; --warn:#e5a957; --bad:#ec8a83; --none:#97a1b1; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --panel:#1a2029; --ink:#e4e8ee; --muted:#9aa4b4; --line:#2c3440; --soft:#222a35;
  --accent:#8fb0e8; --accent-soft:#233149;
  --rec:#5fc4b9; --rec-bg:#16312f; --rep:#86aee9; --rep-bg:#1b2a42; --self:#bf9be8; --self-bg:#2b2140;
  --all:#e5a957; --all-bg:#382a16; --unv:#d993a5; --unv-bg:#3a2229;
  --ok:#6cc28a; --warn:#e5a957; --bad:#ec8a83; --none:#97a1b1; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--panel);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:22px 14px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:end;justify-content:space-between}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.4vw,40px);line-height:1.05;margin:4px 0 0;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:24px;margin:0 0 4px;letter-spacing:.01em;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 6px;letter-spacing:.02em}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.03em;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:12px 12px 9px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
main .wrap{padding-block:24px 64px}
section.view{display:grid;gap:22px}
.lede{max-width:72ch;color:var(--muted);margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
/* evidence tags */
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;padding:1px 6px;border-radius:3px;white-space:nowrap;vertical-align:1px}
.c-RECORD{color:var(--rec);background:var(--rec-bg)}
.c-REPORTED{color:var(--rep);background:var(--rep-bg)}
.c-SELF{color:var(--self);background:var(--self-bg)}
.c-ALLEGATION{color:var(--all);background:var(--all-bg)}
.c-UNVERIFIED{color:var(--unv);background:var(--unv-bg)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted)}
.legend span.item{display:flex;gap:6px;align-items:center}
/* findings */
.finding{display:grid;grid-template-columns:28px 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--soft)}
.finding:first-of-type{border-top:0}
.finding .n{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:3px}
.finding b{font-weight:600}
.finding p{margin:2px 0 0;color:var(--muted);font-size:14px}
/* leads */
.status{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.status::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.s-watch{color:var(--accent)} .s-confirmed{color:var(--ok)} .s-reframed{color:var(--accent)} .s-partial{color:var(--warn)} .s-notfound{color:var(--bad)} .s-unsearched{color:var(--none)}
.leadrow{display:grid;grid-template-columns:minmax(150px,1.1fr) 150px minmax(200px,2fr);gap:6px 16px;padding:12px 0;border-top:1px solid var(--soft);align-items:start}
.leadrow:first-child{border-top:0}
.leadrow .q{font-weight:600}
.leadrow .a{color:var(--muted);font-size:14px}
@media (max-width:640px){.leadrow{grid-template-columns:1fr}}
/* money bars */
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:minmax(120px,210px) 1fr;gap:10px;align-items:center;font-size:13.5px}
.bar .lab{line-height:1.25}
.bar .lab small{display:block;color:var(--muted);font-size:11.5px}
.bar .track{position:relative;height:20px;background:var(--soft);border-radius:3px}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:3px}
.bar .val{position:absolute;left:calc(var(--w) + 6px);top:0;line-height:20px;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fill.in{background:var(--rec)} .fill.debt{background:var(--all)} .fill.out{background:var(--rep)} .fill.forg{background:var(--rec);opacity:.5}
.barhead{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters .fl{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.chip{font-family:var(--body);font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:20px;padding:3px 11px;cursor:pointer}
.chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
input[type=search]{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);min-width:0;width:100%;max-width:280px}
/* timeline */
.tl{position:relative;display:grid;gap:0}
.tl-year{font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent);padding:18px 0 4px;border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);background:var(--bg);z-index:2}
.ev{display:grid;grid-template-columns:96px 1fr;gap:4px 16px;padding:10px 0;border-bottom:1px solid var(--soft)}
.ev .d{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.ev .t{min-width:0}
.ev .tags{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:4px;align-items:center}
.etag{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px}
.src{font-family:var(--mono);font-size:11px}
@media (max-width:520px){.ev{grid-template-columns:1fr}}
/* map */
.mapbox{overflow-x:auto}
.mapbox svg{display:block;min-width:820px;width:100%;height:auto}
.node rect{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.node text{fill:var(--ink);font-family:var(--body);font-size:12.5px}
.node text.sub{fill:var(--muted);font-family:var(--mono);font-size:10px}
.node{cursor:pointer}
.node:hover rect,.node.sel rect{stroke:var(--accent);stroke-width:2}
.node.k-subject rect{fill:var(--accent);stroke:var(--accent)} .node.k-subject text{fill:var(--panel);font-weight:600} .node.k-subject text.sub{fill:var(--accent-soft)}
.node.k-co rect{fill:var(--accent-soft)}
.node.k-re rect{fill:var(--rec-bg)}
.node.k-pol rect{fill:var(--self-bg)}
.node.k-money rect{fill:var(--all-bg)}
.node.k-legal rect{fill:var(--unv-bg)}
.edge{stroke:var(--muted);stroke-width:1.2;fill:none;opacity:.55}
.edge.strong{stroke-width:2;opacity:.8}
.edge.dash{stroke-dasharray:4 4}
.elab{fill:var(--muted);font-family:var(--mono);font-size:9.5px}
.elab-bg{fill:var(--bg)}
.detail{min-height:120px}
.detail .empty{color:var(--muted)}
/* tables */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--soft);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
/* cards */
.ecard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:6px;align-content:start;min-width:0}
.ecard .row1{display:flex;justify-content:space-between;gap:10px;align-items:start}
.ecard .type{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.ecard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:13.5px}
.ecard dt{color:var(--muted)}
.ecard dd{margin:0;min-width:0}
.conf{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:1px 6px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.cf-CONFIRMED{color:var(--ok)} .cf-LIKELY{color:var(--rep)} .cf-POSSIBLE{color:var(--warn)} .cf-UNLIKELY{color:var(--none)}
.grouphead{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 -6px}
/* questions */
.qcard{border-left:3px solid var(--warn);background:var(--panel);border-radius:0 6px 6px 0;padding:14px 18px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.qcard h3{margin-bottom:4px}
.qcard .obs{margin:0 0 8px}
.qcard ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.qcard .check{margin-top:8px;font-size:13.5px}
.qcard .check b{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
details.more{margin-top:4px}
details.more summary{cursor:pointer;color:var(--accent);font-size:13.5px}
.note{font-size:13px;color:var(--muted)}
.todo li{margin:6px 0}
.todo .who{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-left:6px}
footer{color:var(--muted);font-size:12.5px}
/* investigate buttons */
.inv-btn{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);border:1px solid transparent;border-radius:3px;padding:2px 7px;cursor:pointer;white-space:nowrap;line-height:1.4;vertical-align:1px}
.inv-btn:hover{border-color:var(--accent)}
.inv-btn svg{width:12px;height:12px;flex:none}
.inv-btn.on{color:var(--ok);background:transparent;border-color:currentColor}
.inv-btn.on::after{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.finding .act,.leadrow .act{margin-top:6px}
.ev .tags .inv-btn{margin-left:auto}
/* drawer */
.drawer[hidden],.scrim[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(8,12,18,.42);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--panel);color:var(--ink);border-left:1px solid var(--line);z-index:21;overflow-y:auto;display:grid;gap:16px;align-content:start;
  padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.drawer .dhead{display:flex;justify-content:space-between;gap:12px;align-items:start}
.drawer h2{font-size:22px}
.xbtn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:4px;width:32px;height:32px;cursor:pointer;font-size:18px;line-height:1;flex:none}
.dsec{display:grid;gap:8px}
.dsec > .barhead{margin:0}
.linkrow{display:flex;flex-wrap:wrap;gap:6px}
.linkrow a{font-size:13px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;text-decoration:none}
.linkrow a:hover{border-color:var(--accent)}
.ai-out{white-space:pre-wrap;font-size:14px;background:var(--soft);border-radius:4px;padding:12px 14px;min-height:0}
.ai-out:empty{display:none}
.btn{font-family:var(--body);font-size:14px;font-weight:500;border-radius:4px;padding:7px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--panel)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
textarea,input[type=text],select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* investigations */
.ihead{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:baseline}
.icount{font-family:var(--mono);font-size:12px;color:var(--muted)}
.icount b{color:var(--ink);font-size:15px}
.icol{display:grid;gap:10px;align-content:start}
.igroup{display:grid;gap:10px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-items:start}
.fd .sum{font-weight:600;color:var(--ink);margin:2px 0 4px}
.fd ul{margin:4px 0 0;padding-left:18px;display:grid;gap:3px;font-size:13.5px;color:var(--muted)}
.fd .rep{display:block;margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.icard .nt{border-left:2px solid var(--line);padding-left:8px}
.icard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--none);border-radius:0 6px 6px 0;padding:12px 14px;display:grid;gap:6px;min-width:0}
.icard.st-active{border-left-color:var(--accent)} .icard.st-open{border-left-color:var(--warn)} .icard.st-done{border-left-color:var(--ok)} .icard.st-parked{border-left-color:var(--none)}
.icard .t{font-weight:600}
.icard .m{font-family:var(--mono);font-size:11px;color:var(--muted)}
.icard .nt{font-size:14px;color:var(--muted);margin:0}
.icard .fd{font-size:14px;margin:0;border-top:1px dashed var(--line);padding-top:8px}
.icard .fd > b,.drawer .fd > b{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ok);font-weight:500;display:block}
.icard .btnrow select{width:auto}
.icard .linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;font-size:13px;padding:0}
/* brief */
.bl{font-family:var(--display);font-size:clamp(20px,2.6vw,26px);line-height:1.25;font-weight:600;margin:0;text-wrap:balance;max-width:60ch}
.scen{display:grid;gap:6px;border-top:3px solid var(--line);padding-top:10px}
.scen.s1{border-color:var(--ok)} .scen.s2{border-color:var(--warn)} .scen.s3{border-color:var(--bad)}
.scen .pct{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scen p{margin:0;font-size:14px}
.opt{display:grid;gap:6px}
.opt .tagline{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.opt ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
.opt b.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);font-weight:500}
.trip{display:grid;grid-template-columns:120px 1fr;gap:4px 14px;padding:10px 0;border-top:1px solid var(--soft);align-items:start}
.trip:first-child{border-top:0}
@media (max-width:560px){.trip{grid-template-columns:1fr}}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.chk li{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;font-size:14.5px}
.chk li::before{content:"";width:12px;height:12px;border:1.5px solid var(--accent);border-radius:3px;margin-top:4px}
.disclaim{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
/* manual ops */
.mop{display:grid;grid-template-columns:28px 1fr;gap:6px 12px;padding:14px 0;border-top:1px solid var(--soft)}
.mop:first-child{border-top:0}
.mop input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.mop.done .mt{text-decoration:line-through;color:var(--muted)}
.mop .mt{font-weight:600}
.mop .mm{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:4px 0}
.mop ol{margin:4px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
.mop ol li{margin:2px 0}
.pri{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid currentColor}
.pri-1{color:var(--bad)} .pri-2{color:var(--warn)} .pri-3{color:var(--none)}
.who2{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
/* live ticker */
.ticker{display:flex;align-items:stretch;border-top:1px solid var(--line);background:var(--soft);font-size:13px;min-width:0}

.ticker .tk-dot{width:8px;height:8px;border-radius:50%;background:var(--bad)}

.ticker .tk-track{display:flex;gap:34px;width:max-content;padding:6px 16px;white-space:nowrap}
.ticker .tk-item{display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:var(--ink);font:inherit;cursor:pointer;padding:0}
.ticker .tk-item:hover .tk-txt{text-decoration:underline}
.ticker .tk-time{font-family:var(--mono);font-size:11px;color:var(--muted)}
.ticker .tk-item.fresh::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){
 .ticker .tk-track.run{animation:tk var(--dur,60s) linear infinite}
 .ticker .tk-view:hover .tk-track.run,.ticker .tk-view:focus-within .tk-track.run{animation-play-state:paused}
 @keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
 .ticker .tk-dot{animation:pulse 1.8s ease-in-out infinite}
 @keyframes pulse{50%{opacity:.35}}
}
@media (prefers-reduced-motion:reduce){.ticker .tk-view{overflow-x:auto}}

table.wt{width:100%;border-collapse:collapse;font-size:13px}

.oc{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:1px 6px;border-radius:3px;border:1px solid currentColor}
.oc.done{color:var(--ok)}.oc.parked{color:var(--warn)}.oc.none{color:var(--none)}.oc.fail{color:var(--bad)}.oc.merged{color:var(--accent)}

.watch ul{margin:4px 0 0;padding-left:18px;font-size:14px}

.logent .rep{white-space:pre-wrap;font-size:12.5px;line-height:1.5;background:var(--soft);border-radius:4px;padding:10px;margin-top:6px;max-height:420px;overflow:auto}

<script>
/* ============================================================
   DATA — the single source of truth. The scheduled merge run edits
   ONLY these structures; views render from them automatically.
   ============================================================ */
/* ============================================================
   CASE CONFIG — fill this in once, at kickoff. Everything else
   on the page reads from it.
   ============================================================ */
const CASE = {
  key:"case",                       // short slug, used for browser-storage keys (e.g. "nc13-rumors")
  title:"New Case File",            // page heading, e.g. "NC-13 Rumor File"
  eyebrow:"Working file · public-record research",
  subject:"the subject",            // who/what this file is about, as used in sentences ("the candidate", "Acme Corp")
  subjectShort:"the subject",       // short form for labels ("Is it the subject?")
  searchName:"",                    // quoted name used in the drawer's search links, e.g. "Jane Doe"
  watchName:"",                     // YOUR name: any appearance anywhere in the data is flagged on the Overview
  owner:"you",                      // who the file is for, used in the Ask-Claude prompt
  purpose:"make sound, well-informed decisions",
  mergeTimes:"the daily merge",    // shown on the Run Logs tab, e.g. "the daily merge, around 6:40 PM"
  pass:"Pass 0",                    // header meta line; the merge run updates it
  asof:"",                          // date of last merge
  searchLinks:[                     // extra registry links in the Investigate drawer: ["Label","https://..."]
  ],
  reports:[                         // research log on the Sources tab: ["pass","date","project/path.md"]
  ]
};

const CLS = {
  RECORD:{label:"Record",desc:"Court or government filing"},
  REPORTED:{label:"Reported",desc:"Reputable news"},
  SELF:{label:"Self-reported",desc:"The subject's own statements, site, campaign or marketing"},
  ALLEGATION:{label:"Allegation",desc:"Claim in a lawsuit or by an adverse party; unproven"},
  UNVERIFIED:{label:"Unverified",desc:"Forum, social post, aggregator or hearsay"}
};

/* Source reliability grades (optional 3rd element of each SRC entry) */
const GRADES = {
  A:{label:"A · Primary record",desc:"Court, government, regulator, the document itself"},
  B:{label:"B · Established outlet",desc:"News organization with editors and a corrections policy"},
  C:{label:"C · Interested party",desc:"Campaign, advocacy group, partisan outlet, the subject or an opponent"},
  D:{label:"D · Anonymous / social",desc:"Forum, social post, unsourced blog, screenshot"},
  E:{label:"E · Unknown",desc:"Can't tell who is behind it yet"}
};

/* Claims Ledger verdicts */
const VERDICTS = {
  SUPPORTED:{label:"Supported",desc:"Primary records or multiple independent solid sources back it",col:"--ok"},
  PARTLY:{label:"Partly supported",desc:"Some of it holds; key parts don't or are exaggerated",col:"--s4"},
  OPEN:{label:"Can't tell yet",desc:"Not enough evidence either way",col:"--none"},
  UNSUPPORTED:{label:"Unsupported",desc:"Searched for; no credible evidence found",col:"--warn"},
  CONTRADICTED:{label:"Contradicted",desc:"Solid evidence shows it is false",col:"--bad"}
};

/* Timeline threads: short key -> label. Set at kickoff, e.g. {subj:"The subject",pol:"Politics",money:"Money",legal:"Lawsuits",rumor:"Rumors"} */
const THREADS = {
  subj:"The subject", legal:"Legal", money:"Money", pol:"Politics", rumor:"Rumors"
};

/* Sources: key:["Label","https://url","grade A–E (optional)"] */
const SRC = {
};

/* Claims Ledger: one row per rumor or claim being tested.
   kind:"fact"   -> checkable; gets a verdict.
   kind:"values" -> a judgment evidence can't settle (e.g. "what counts as giving back");
                    no verdict — pro/con hold the strongest case each side makes, and v is ignored.
   {id:"c-short-slug", kind:"fact"|"values", claim:"the claim as stated", by:"who is making/spreading it",
    first:"YYYY-MM-DD", firstWhere:"where it first appeared", spread:"how it travelled",
    v:"SUPPORTED|PARTLY|OPEN|UNSUPPORTED|CONTRADICTED",
    pro:["best evidence for; tag classes inline like {RECORD} or {REPORTED}",...], con:["best evidence against",...],
    note:"what would settle it / gaps", s:["srcKey",...]} */
const CLAIMS = [
];

/* Timeline events: {d:"YYYY-MM-DD", dl:"display date", t:"text (may use <b>,<i>)", c:CLASS, th:[threads], s:[src keys]} */
const EVENTS = [
];

/* Leads the owner brought in: {q, st: confirmed|reframed|partial|notfound|unsearched|watch, a: html, s:[]} */
const LEADS = [
];

/* Key findings, most important first: {h, p, c} */
const FINDINGS = [
];

/* Optional money bars on the Overview, $M: {l, sub, v, k:"in"|"out"|"debt"|"forg", c} */
const MONEY = { in:[], out:[], debt:[] };

/* Connection map: NODES {id,x,y,k,l,sub,info,go}; k = subject|co|re|pol|money|legal. Canvas is 1010×625. The first node is the centre. */
const NODES = [
];
/* EDGES: [fromId, toId, "label", strong(1), dashed(1)] */
const EDGES = [
];

/* Entities: {g:"group heading", n, t:type, role, status, when, conf:CONFIRMED|LIKELY|POSSIBLE|UNLIKELY, notes, s} */
const ENTITIES = [
];
/* People, only in their role in the record: {n, r, c, s} */
const PEOPLE = [
];
/* Affiliations the subject describes themselves: {n, k:type, d, s} */
const AFFIL = [
];
/* Legal & money matters: {m, ct, p, ty, dt, o, amt, c, s} */
const LEGAL = [
];
/* Name variants / possible aliases: {n, conf, why, s} */
const ALIASES = [
];
/* Things that don't add up: {h, obs, poss:[...], check} */
const QUESTIONS = [
];
/* Next searches: {t, w:"who/what tool"} */
const TODO = [
];
/* Decision brief (optional; the Brief tab hides itself while bottom is empty) */
const BRIEF = {
  asof:"", title:"What this means for you", bottom:"",
  facts:[],        // ["fact","detail"]
  scen:[],         // {n,p,sig,c:"s1|s2|s3"}
  opts:[],         // {w,t,do:[],pro,con}
  trips:[],        // ["trigger","what to do"]
  protect:[], protectTitle:"Protect yourself now",
  team:[], teamTitle:"For people who rely on you",
  ask:[], askTitle:"Questions worth asking directly"
};
/* Things only the owner can do: {id:"m-slug", p:1|2|3, who, t, why, link:["label","url"], steps:[]} */
const MANUAL = [
];

/* ============================================================
   RENDERING
   ============================================================ */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const tag = c=>`<span class="tag c-${c}" title="${esc(CLS[c].desc)}">${CLS[c].label.toUpperCase()}</span>`;
const srcs = arr=>arr&&arr.length?arr.map(k=>SRC[k]?`${SRC[k][2]?`<span class="grade" title="${esc((GRADES[SRC[k][2]]||GRADES.E).label)}">${esc(SRC[k][2])}</span>`:""}<a class="src" href="${SRC[k][1]}" target="_blank" rel="noopener">${esc(SRC[k][0])}</a>`:"").join(" · "):`<span class="src note">no source yet</span>`;
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const strip = s=>String(s).replace(/<[^>]+>/g,"");
const tagify = s=>esc(s).replace(/\{(RECORD|REPORTED|SELF|ALLEGATION|UNVERIFIED)\}/g,(m,k)=>tag(k));
const slug = s=>strip(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48);

/* ---------- Registry of investigable items ---------- */
const REG = {};
function addReg(ref,o){let r=ref,i=2;while(REG[r])r=ref+"-"+(i++);REG[r]=o;return r}
FINDINGS.forEach((f,i)=>f.ref=addReg("f-"+(i+1),{title:f.h,kind:"Finding",ctx:f.p,c:f.c,s:[],view:"overview"}));
LEADS.forEach(l=>l.ref=addReg("lead-"+slug(l.q),{title:l.q,kind:"Your lead",ctx:strip(l.a),s:l.s,view:"overview"}));
EVENTS.forEach(e=>e.ref=addReg("ev-"+e.d,{title:e.dl+" · "+strip(e.t).slice(0,80)+(strip(e.t).length>80?"…":""),kind:"Timeline event",ctx:e.dl+": "+strip(e.t),c:e.c,s:e.s,th:e.th,view:"timeline"}));
NODES.forEach(n=>n.ref=addReg("node-"+n.id,{title:n.l,kind:"Connection",ctx:n.info,s:[],view:"map"}));
ENTITIES.forEach(e=>e.ref=addReg("ent-"+slug(e.n),{title:e.n,kind:"Entity",ctx:`${e.t}. Role: ${e.role}. Status: ${e.status}. When: ${e.when}. Confidence tied to ${CASE.subjectShort}: ${e.conf}. ${e.notes}`,s:e.s,view:"entities"}));
PEOPLE.forEach(p=>p.ref=addReg("per-"+slug(p.n),{title:p.n,kind:"Person",ctx:p.r,c:p.c,s:p.s,view:"entities"}));
LEGAL.forEach(r=>r.ref=addReg("lg-"+slug(r.m),{title:r.m,kind:"Legal / money",ctx:`${r.m}. ${r.ct}. Parties: ${r.p}. Type: ${r.ty}. Date: ${r.dt}. Status: ${r.o}. Amount: ${r.amt}.`,c:r.c,s:r.s,view:"legal"}));
ALIASES.forEach(a=>a.ref=addReg("al-"+slug(a.n),{title:a.n,kind:"Name variant",ctx:`${a.n}: ${a.conf}. ${a.why}`,s:a.s,view:"aliases"}));
AFFIL.forEach(a=>a.ref=addReg("af-"+slug(a.n),{title:a.n,kind:"Self-reported affiliation · "+a.k,ctx:`${a.n} (${a.k}). ${a.d} This comes from the subject’s own statements; nothing beyond that has been researched. Investigating it means looking for public overlap (board roles, donations in public filings, shared people), not private beliefs.`,c:"SELF",s:a.s,view:"entities"}));
CLAIMS.forEach(c=>c.ref=addReg("cl-"+(c.id||slug(c.claim)),{title:c.claim,kind:c.kind==="values"?"Values question":"Claim",ctx:`${c.claim}. Said by: ${c.by||"unknown"}. ${c.kind==="values"?"Values question, no verdict.":"Verdict: "+((VERDICTS[c.v]||VERDICTS.OPEN).label)+"."} For: ${strip((c.pro||[]).join("; "))}. Against: ${strip((c.con||[]).join("; "))}. ${c.note||""}`,s:c.s,view:"claims"}));
QUESTIONS.forEach(q=>q.ref=addReg("q-"+slug(q.h),{title:q.h,kind:"Open question",ctx:`${q.obs} Possible explanations: ${q.poss.join(" / ")} Would settle it: ${q.check}`,s:[],view:"questions"}));

const ICON_MAG = `<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
let INV = [], DB = null, CAN_WRITE = true, invState = "loading";
const invFor = ref=>INV.find(x=>x.ref===ref&&x.status!=="done");
const invBtn = ref=>{const on=invFor(ref);return `<button class="inv-btn${on?" on":""}" data-inv="${ref}" title="Investigate further">${ICON_MAG}<span>${on?"Tracking":"Investigate"}</span></button>`};

const VIEWS = [
 ["overview","Overview"],["claims","Claims Ledger"],["brief","Decision Brief"],["logs","Run Logs"],["todo","Your To-Dos"],["investigations","Investigations"],["timeline","Timeline"],["map","Connections"],["entities","Entities & People"],
 ["legal","Legal & Money"],["aliases","Names"],["questions","Open Questions"],["sources","Sources & Next Steps"]
];

function legend(){return `<div class="legend">${Object.keys(CLS).map(c=>`<span class="item">${tag(c)} ${esc(CLS[c].desc)}</span>`).join("")}</div>`}

function watchHits(){
 const w=(CASE.watchName||"").trim().toLowerCase();if(!w)return [];
 const hits=[];const chk=(txt,where)=>{if(strip(txt||"").toLowerCase().includes(w))hits.push(strip(where))};
 FINDINGS.forEach(f=>chk(f.h+" "+f.p,"Finding: "+f.h));
 CLAIMS.forEach(c=>chk([c.claim,c.by,c.spread,c.note,...(c.pro||[]),...(c.con||[])].join(" "),"Claim: "+c.claim));
 EVENTS.forEach(e=>chk(e.t,"Timeline: "+e.dl));
 PEOPLE.forEach(p=>chk(p.n+" "+p.r,"Person: "+p.n));
 ENTITIES.forEach(e=>chk([e.n,e.role,e.notes].join(" "),"Entity: "+e.n));
 LEGAL.forEach(r=>chk([r.m,r.p,r.o].join(" "),"Legal: "+r.m));
 QUESTIONS.forEach(q=>chk(q.h+" "+q.obs,"Question: "+q.h));
 return hits;
}
function verdictBar(){
 if(!CLAIMS.length)return "";
 const facts=CLAIMS.filter(c=>c.kind!=="values"),vals=CLAIMS.length-facts.length,n=k=>facts.filter(c=>(c.v||"OPEN")===k).length;
 const segs=Object.keys(VERDICTS).filter(k=>n(k)).map(k=>`<div class="vseg" style="flex:${n(k)};background:var(${VERDICTS[k].col})" title="${esc(VERDICTS[k].label)}: ${n(k)}"></div>`).join("");
 return `<div class="panel"><h2>Claims at a glance</h2><p class="note" style="margin:0 0 6px">${facts.length} checkable claim${facts.length===1?"":"s"}${vals?` · ${vals} values question${vals===1?"":"s"} (both sides shown, no verdict)`:""} · <a href="#claims" data-go-tk="claims">open the Claims Ledger</a></p>
  ${facts.length?`<div class="vbar">${segs}</div><div class="legend2">${Object.keys(VERDICTS).map(k=>`<span><i style="background:var(${VERDICTS[k].col})"></i>${esc(VERDICTS[k].label)} · ${n(k)}</span>`).join("")}</div>`:""}</div>`;
}
function vOverview(){
 const stLabel={confirmed:"Confirmed",reframed:"Confirmed, reframed",partial:"Partly found",notfound:"Not found yet",unsearched:"Not yet searched",watch:"Watching"};
 const allM=[...MONEY.in,...MONEY.out,...MONEY.debt],max=Math.max(1,...allM.map(b=>b.v))*1.3;

 const hits=watchHits(), empty=!FINDINGS.length&&!LEADS.length&&!CLAIMS.length;

async function addInv(o){
 if(!DB)throw {code:"none"};
 const now=new Date().toISOString();
 await DB.collection("investigations").add({ref:o.ref,title:o.title,kind:o.kind||"Investigation",view:o.view||"",note:o.note||"",analysis:o.analysis||"",findings:"",status:"open",origin:"page",createdAt:now,updatedAt:now});

function fmtFind(t){
 const lines=String(t||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
 let sum="",items=[],rep="",paras=[];
 lines.forEach((l,i)=>{
  if(/^Report:/i.test(l)){rep=l.replace(/^Report:\s*/i,"");return}
  if(/^[-•]\s+/.test(l)){items.push(l.replace(/^[-•]\s+/,""));return}
  if(!sum&&i===0){sum=l;return}
  paras.push(l);
 });
 const md=x=>esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
 return `${sum?`<div class="sum">${md(sum)}</div>`:""}${paras.map(x=>`<div>${md(x)}</div>`).join("")}${items.length?`<ul>${items.map(x=>`<li>${md(x)}</li>`).join("")}</ul>`:""}${rep?`<span class="rep">Full report: ${esc(rep)}</span>`:""}`;
}

async function ask(){
 const s=await sampleReady;if(!s)return;
 const ref=drawerRef,o=REG[ref];if(!o)return;
 const out=$("#aiout"),b=$("#askbtn");b.disabled=true;out.textContent="Thinking…";
 askCtl=new AbortController();
 const related=(o.th?EVENTS.filter(e=>e.th.some(t=>o.th.includes(t))):[]).slice(0,30).map(e=>`- ${e.dl}: ${strip(e.t)} [${CLS[e.c].label}]`).join("\n");
 const prompt=`You are helping ${CASE.owner} review public information about ${CASE.subject} so they can ${CASE.purpose}. Rules: separate what the record shows from possibilities; label every possibility as a possibility; never state a conclusion the evidence doesn't support; keep checkable facts apart from value judgments, and on a values question give the strongest case each side makes without picking one; don't speculate about anyone's private life; name specific public records, filings, datasets or primary documents that would confirm or rule things out.

Item (${o.kind}): ${o.title}
Detail: ${o.ctx}
Evidence class: ${o.c?CLS[o.c].label:"mixed or none"}
Sources on file: ${(o.s||[]).map(k=>SRC[k]?SRC[k][0]:"").filter(Boolean).join("; ")||"none"}

Key findings so far:
${FINDINGS.map(f=>"- "+f.h).join("\n")}
${related?"\nRelated timeline events:\n"+related:""}

Answer in plain text with three short parts, each starting with its heading on its own line: What the record shows / What it could mean (2 to 4 possibilities, or for a values question the strongest case on each side) / What would settle it (specific searches or documents). Under 230 words. No markdown symbols.`;
 try{
  const r=await s(prompt,{signal:askCtl.signal,onText:({text})=>{if(drawerRef===ref)out.textContent=text}});
  if(drawerRef===ref)out.textContent=r.text+(r.truncated?"\n\n(Cut short.)":"");
  lastAnalysis[ref]=r.text;
 }catch(e){
  if(drawerRef!==ref)return;
  out.textContent=e&&e.code==="cancelled"?"":e&&e.code==="not_granted"?"Claude isn’t available on this page for you.":e&&e.code==="rate_limited"?"Too many requests just now. Try again in a minute.":"Couldn’t get an answer. Try again.";
 }finally{if(drawerRef===ref)b.disabled=false}
}
async function addFromDrawer(){
 const ref=drawerRef,o=REG[ref];const msg=$("#dmsg"),b=$("#dadd");b.disabled=true;msg.textContent="Saving…";
 try{await addInv({ref,title:o.title,kind:o.kind,view:o.view,note:($("#dnote")||{}).value?.trim()||"",analysis:lastAnalysis[ref]||""});msg.textContent="Added."}
 catch(e){msg.textContent=errMsg(e);b.disabled=false}
}

(async()=>{

 db.collection("insights").orderBy("at","desc").limit(100).onSnapshot(s=>{INSIGHTS=s.docs.map(d=>Object.assign({id:d.id},d.data()));logState="ready";refreshLogs()},()=>{logState="error";refreshLogs()});

/* ---------- Live ticker ---------- */
let FEED=[];
const seenAt=(()=>{const v=store.get(CASE.key+"-feed-seen");return v?+v:0})();
function ago(iso){const t=new Date(iso).getTime();if(!t)return "";const m=Math.round((Date.now()-t)/60000);if(m<1)return "just now";if(m<60)return m+"m ago";const h=Math.round(m/60);if(h<48)return h+"h ago";return new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function renderTicker(){
 const bar=$("#ticker");if(!FEED.length){bar.hidden=true;return}
 bar.hidden=false;
 const items=FEED.map(f=>{const fresh=new Date(f.at).getTime()>seenAt;return `<button class="tk-item${fresh?" fresh":""}"${f.ref?` data-open="${esc(f.ref)}"`:` data-go-tk="${esc(f.view||"overview")}"`} title="${esc(f.text)}"><span class="tk-time">${esc(ago(f.at))}</span><span class="tk-txt">${esc(f.text)}</span></button>`}).join("");
 const tr=$("#tktrack");
 tr.innerHTML=items+`<span aria-hidden="true" style="display:contents">${items}</span>`;
 tr.style.setProperty("--dur",Math.max(40,FEED.length*9)+"s");
 tr.classList.add("run");
 const n=FEED.filter(f=>new Date(f.at).getTime()>seenAt).length;
 const nb=$("#tknew");nb.hidden=!n;nb.textContent=n+" new";
}
